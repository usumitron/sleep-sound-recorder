<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Android のアダプティブアイコンの背景（app-icon.svg の背景。光は縮小した三日月の位置に合わせる） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263050"/>
      <stop offset="1" stop-color="#121829"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.50" r="0.40">
      <stop offset="0" stop-color="#F2B656" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#F2B656" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F2B656" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
</svg>
